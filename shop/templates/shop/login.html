{% extends 'shop/base.html' %}

{% block title %}Вход | Monpans`e{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 80px auto; padding: 40px; border: 1px solid #eee; background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.02);">
    <h1 style="font-family: 'Playfair Display', serif; font-size: 28px; text-align: center; margin-bottom: 10px;">Вход в аккаунт</h1>

    {% if messages %}
        {% for message in messages %}
            <div style="padding: 12px; margin-bottom: 20px; background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; font-size: 13px; text-align: center;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" style="display: flex; flex-direction: column; gap: 20px;">
        {% csrf_token %}

        <div>
            <label style="display: block; font-size: 11px; color: #999; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px;">Логин</label>
            <input type="text" name="username" required placeholder="Ваш логин"
                   style="width: 100%; padding: 12px; border: 1px solid #ddd; outline: none; font-family: 'Montserrat', sans-serif; box-sizing: border-box; transition: 0.3s;">
        </div>

        <div>
            <label style="display: block; font-size: 11px; color: #999; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px;">Пароль</label>
            <input type="password" name="password" required placeholder="••••••"
                   style="width: 100%; padding: 12px; border: 1px solid #ddd; outline: none; box-sizing: border-box; transition: 0.3s;">
        </div>

        <button type="submit" style="background: #1a1a1a; color: #fff; padding: 16px; border: none; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-top: 10px; font-family: 'Montserrat', sans-serif; font-size: 14px;">
            Войти
        </button>
    </form>

    <p style="text-align: center; margin-top: 30px; font-size: 13px; color: #999;">
        Нет аккаунта? <a href="{% url 'register' %}" style="color: #1a1a1a; text-decoration: underline; font-weight: 500;">Зарегистрироваться</a>
    </p>
</div>

<style>
    input:focus {
        border-color: #1a1a1a !important;
    }
    button:hover {
        background: #333 !important;
        letter-spacing: 3px !important;
    }
</style>
{% endblock %}
